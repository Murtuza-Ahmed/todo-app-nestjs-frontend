<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <!-- TODO: replace with your real Vercel URL after deploying -->
    <title>Todo App — Organize Your Tasks Simply</title>
    <meta
      name="description"
      content="Todo App is a simple, fast task manager. Create an account, add todos, track active and completed tasks — all in one clean interface."
    />
    <meta
      name="keywords"
      content="todo app, task manager, todo list, productivity, task tracker"
    />
    <meta name="author" content="Murtuza Ahmed" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#8b5cf6" />
    <link
      rel="canonical"
      href="https://todo-app-nestjs-frontend.vercel.app/"
    />

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp…) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Todo App" />
    <meta property="og:title" content="Todo App — Organize Your Tasks Simply" />
    <meta
      property="og:description"
      content="A simple, fast task manager. Create an account, add todos, track active and completed tasks."
    />
    <meta
      property="og:url"
      content="https://todo-app-nestjs-frontend.vercel.app/"
    />
    <meta
      property="og:image"
      content="https://todo-app-nestjs-frontend.vercel.app/og-image.png"
    />
    <meta property="og:image:alt" content="Todo App logo" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Todo App — Organize Your Tasks Simply" />
    <meta
      name="twitter:description"
      content="A simple, fast task manager. Create an account, add todos, track active and completed tasks."
    />
    <meta
      name="twitter:image"
      content="https://todo-app-nestjs-frontend.vercel.app/og-image.png"
    />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Todo App",
        "description": "A simple, fast task manager built with React and NestJS.",
        "url": "https://todo-app-nestjs-frontend.vercel.app/",
        "applicationCategory": "ProductivityApplication",
        "operatingSystem": "Web",
        "author": { "@type": "Person", "name": "Murtuza Ahmed" },
        "offers": { "@type": "Offer", "price": "0" }
      }
    </script>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css"

      crossorigin="anonymous"
    />

  <body className="bg-blue-200">
    <div id="root"></div>
